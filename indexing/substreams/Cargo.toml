[package]
name = "nexa-v6-substreams"
version = "1.0.0"
edition = "2021"
license = "ISC"
description = "Shared Nexa V6 Substreams event projection."

[lib]
name = "nexa_v6_substreams"
crate-type = ["cdylib", "rlib"]

[dependencies]
ethabi = "17.2.0"
hex = "0.4.3"
prost = "0.13.5"
substreams = "0.7.6"
substreams-ethereum = "0.11.1"

[build-dependencies]
prost-build = "0.13.5"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = true
opt-level = "s"
strip = true

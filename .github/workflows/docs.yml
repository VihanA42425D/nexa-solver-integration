name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs-ticket-worker/**"
      - "config/indexnow.json"
      - "src/worker.mjs"
      - "public/.well-known/nexa-solver.json"
      - "public/.well-known/nexa-onchain-discovery.json"
      - "public/.well-known/nexa-standards.json"
      - "wrangler.jsonc"
      - "scripts/generate-docs-site.mjs"
      - "scripts/validate-docs-site.mjs"
      - "scripts/validate-docs-external-links.mjs"
      - "scripts/submit-indexnow.mjs"
      - "scripts/repo-secret-audit.mjs"
      - "openapi/openapi.json"
      - "nexa-mainnet-v6.json"
      - "networks/network-ids.json"
      - "standards/nexa-standards.json"
      - "sdk-spec/nexa-v6-sdk-contract.json"
      - "indexing/indexing-manifest.json"
      - "package.json"
      - "test/docs-ticket-worker.test.mjs"
      - "test/worker.test.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "docs-ticket-worker/**"
      - "config/indexnow.json"
      - "src/worker.mjs"
      - "public/.well-known/nexa-solver.json"
      - "public/.well-known/nexa-onchain-discovery.json"
      - "public/.well-known/nexa-standards.json"
      - "wrangler.jsonc"
      - "scripts/generate-docs-site.mjs"
      - "scripts/validate-docs-site.mjs"
      - "scripts/validate-docs-external-links.mjs"
      - "scripts/submit-indexnow.mjs"
      - "scripts/repo-secret-audit.mjs"
      - "openapi/openapi.json"
      - "nexa-mainnet-v6.json"
      - "networks/network-ids.json"
      - "standards/nexa-standards.json"
      - "sdk-spec/nexa-v6-sdk-contract.json"
      - "indexing/indexing-manifest.json"
      - "package.json"
      - "test/docs-ticket-worker.test.mjs"
      - "test/worker.test.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - run: npm ci
      - run: python -m pip install -r docs-site/requirements.txt
      - run: npm run docs:validate
      - run: npm run docs:indexnow:check
      - run: npm run docs:ticket:check
      - run: node --test test/docs-ticket-worker.test.mjs
      - run: node --test test/worker.test.mjs
      - name: Deploy documentation to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_GH }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy docs-site/site --project-name=nexa-docs --branch=main
      - name: Notify IndexNow about documentation changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: npm run docs:indexnow:submit

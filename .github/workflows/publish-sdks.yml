name: Publish SDKs v1.0.0

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registry target
        required: true
        default: all
        type: choice
        options:
          - all
          - npm
          - pypi
          - crates
          - go
          - maven
          - nuget

concurrency:
  group: publish-sdks-v1.0.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-v1.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sdk:conformance
      - run: npm run validate

  npm:
    if: ${{ inputs.target == 'all' || inputs.target == 'npm' }}
    needs: gate
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-v1.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm publish --access public

  pypi:
    if: ${{ inputs.target == 'all' || inputs.target == 'pypi' }}
    needs: gate
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-v1.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build
      - run: python -m pip install -e ".[test]"
        working-directory: sdks/python
      - run: python -m pytest
        working-directory: sdks/python
      - run: python -m build
        working-directory: sdks/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  crates:
    if: ${{ inputs.target == 'all' || inputs.target == 'crates' }}
    needs: gate
    runs-on: ubuntu-latest
    environment: sdk-release
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdk-v1.0.0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo package --locked
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  go:
    if: ${{ inputs.target == 'all' || inputs.target == 'go' }}
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdks/go/v1.0.0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - run: go test ./...
        working-directory: sdks/go
      - run: go list -m github.com/VihanA42425D/nexa-solver-integration/sdks/go@v1.0.0
        env:
          GOPROXY: https://proxy.golang.org

  maven:
    if: ${{ inputs.target == 'all' || inputs.target == 'maven' }}
    needs: gate
    runs-on: ubuntu-latest
    environment: sdk-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdks/jvm/v1.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: MAVEN_CENTRAL_PASS
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: mvn --batch-mode -Prelease deploy
        working-directory: sdks/jvm
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_PASS: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  nuget:
    if: ${{ inputs.target == 'all' || inputs.target == 'nuget' }}
    needs: gate
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sdks/dotnet/nuget/v1.0.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test sdks/dotnet/tests/Nexa.V6.Sdk.Tests/Nexa.V6.Sdk.Tests.csproj --configuration Release
      - run: dotnet pack sdks/dotnet/src/Nexa.V6.Sdk/Nexa.V6.Sdk.csproj --configuration Release --output artifacts/nuget
      - uses: actions/upload-artifact@v4
        with:
          name: VihanA.Nexa.V6.Sdk-1.0.0
          path: artifacts/nuget/VihanA.Nexa.V6.Sdk.1.0.0.nupkg
          if-no-files-found: error
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

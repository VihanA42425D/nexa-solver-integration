type ProtocolDeployment @entity(immutable: true) {
  id: ID!
  chainId: BigInt!
  releaseId: Bytes!
  contractName: String!
  contractAddress: Bytes!
  startBlock: BigInt!
  runtimeCodeHash: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

type Network @entity(immutable: false) {
  id: ID!
  chainId: BigInt!
  networkId: Bytes!
  vmType: Bytes!
  networkReference: Bytes!
  metadataHash: Bytes!
  status: Int!
  generation: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

type NetworkStatusChange @entity(immutable: true) {
  id: ID!
  chainId: BigInt!
  networkId: Bytes!
  previousStatus: Int!
  status: Int!
  generation: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
}

